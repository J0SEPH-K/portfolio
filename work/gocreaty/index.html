<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoCreaty</title>
  <meta name="description" content="GoCreaty demo: explore trending Shorts, why they are trending, viral topics and top creators, on real trend data.">
  <meta name="theme-color" content="#08090b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css?v=10162115">
  <link rel="stylesheet" href="style.css?v=10162115">
</head>
<body>
  <header class="bar">
    <a class="bar__back mono" href="../../index.html#work">← Portfolio</a>
    <p class="bar__title"><b>GoCreaty</b><span class="mono">Why Shorts go viral · real trend data</span></p>
    <nav class="tabs mono" aria-label="Views">
      <a href="#trending" data-tab="trending">Trending</a>
      <a href="#virals" data-tab="virals">Virals</a>
      <a href="#creators" data-tab="creators">Creators</a>
    </nav>
  </header>

  <main>
    <!-- TRENDING -->
    <section class="view" data-view="trending" aria-label="Trending Shorts">
      <div class="filters">
        <label class="search"><span class="sr-only">Search</span><input type="search" data-q placeholder="Search titles or creators" autocomplete="off"></label>
        <div class="seg mono" role="group" aria-label="Sort" data-sort>
          <button data-s="rank" aria-pressed="true">Rank</button>
          <button data-s="views" aria-pressed="false">Views</button>
          <button data-s="reach" aria-pressed="false">Reach</button>
        </div>
        <div class="cats mono" data-cats></div>
        <span class="count mono" data-count></span>
      </div>
      <div class="cards" data-cards></div>
    </section>

    <!-- VIRALS -->
    <section class="view" data-view="virals" hidden aria-label="Viral topics">
      <div class="virals">
        <div class="cloud-wrap">
          <p class="kicker mono"><span data-vtotal></span> trending videos · last 24h · click a topic</p>
          <div class="cloud" data-cloud></div>
        </div>
        <aside class="topic" data-topic></aside>
      </div>
    </section>

    <!-- CREATORS -->
    <section class="view" data-view="creators" hidden aria-label="Top creators">
      <div class="creators">
        <p class="kicker mono">Top creators · ranked by views across today’s trending Shorts</p>
        <ol class="board" data-board></ol>
      </div>
    </section>

    <!-- DETAIL -->
    <section class="detail" data-detail hidden aria-label="Short analysis" aria-modal="true" role="dialog">
      <div class="detail__inner" data-detail-body></div>
    </section>
  </main>

  <script src="app.js?v=10162115"></script>
</body>
</html>
