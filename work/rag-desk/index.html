<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Desk</title>
  <meta name="description" content="A document Q&A demo: documents are indexed in the browser (BM25), answers cite their supporting sentences, and it refuses when there is no evidence. Add your own documents.">
  <meta name="theme-color" content="#08090b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css?v=10162115">
  <link rel="stylesheet" href="style.css?v=10162115">
</head>
<body>
  <header class="bar">
    <a class="bar__back mono" href="../../index.html#work">← Portfolio</a>
    <p class="bar__title"><b>RAG Desk</b><span class="mono">BM25 · rerank · cite or refuse</span></p>
    <p class="bar__stats mono hide-sm"><span><b data-docs>0</b> docs</span><span><b data-chunks>0</b> chunks</span></p>
  </header>

  <main class="rag">
    <aside class="lib" aria-label="Document library">
      <p class="label mono">Library</p>
      <ul class="lib__docs" data-docs-list></ul>
      <label class="add" data-add tabindex="0">
        <input type="file" accept=".txt,.md,text/plain,text/markdown" multiple hidden data-file>
        <span class="add__plus" aria-hidden="true">+</span>
        <span><b>Add a document</b><small>Drop .txt / .md, or click. Paste works too.</small></span>
      </label>
    </aside>

    <section class="chat" aria-label="Conversation">
      <div class="chat__log" data-log aria-live="polite">
        <div class="hello" data-hello>
          <p class="mono">Ask the documents</p>
          <h1>Answers from the documents,<br>with the <span>evidence</span>.</h1>
          <div class="sugg" data-sugg></div>
        </div>
      </div>
      <form class="composer" data-form>
        <label class="sr-only" for="q">Question</label>
        <textarea id="q" rows="1" placeholder="Ask a question · Enter to send" autocomplete="off"></textarea>
        <button type="submit" class="send" data-send aria-label="Send">↵</button>
      </form>
    </section>

    <aside class="ev" aria-label="Evidence">
      <div class="ev__head mono"><span>Evidence</span><span data-ev-meta>—</span></div>
      <ol class="ev__list" data-ev><li class="ev__empty">Ask a question and the retrieved passages appear here with their scores. Words that match the question are highlighted.</li></ol>
      <div class="reader" data-reader hidden>
        <div class="reader__head"><span class="mono" data-reader-title></span><button class="x mono" data-reader-close aria-label="Close">✕</button></div>
        <div class="reader__body" data-reader-body></div>
      </div>
    </aside>
  </main>

  <div class="toast mono" data-toast hidden></div>
  <script src="corpus.js?v=10162115"></script>
  <script src="app.js?v=10162115"></script>
</body>
</html>
