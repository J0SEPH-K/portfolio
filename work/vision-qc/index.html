<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision QC</title>
  <meta name="description" content="A working machine-vision inspection console: it detects defects in panel pixels, and the verdict, precision and recall update live as you move the threshold.">
  <meta name="theme-color" content="#08090b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css?v=10162115">
  <link rel="stylesheet" href="style.css?v=10162115">
</head>
<body>
  <header class="bar">
    <a class="bar__back mono" href="../../index.html#work">← Portfolio</a>
    <p class="bar__title"><b>Vision QC</b><span class="mono">Line 03 · OLED panel · Cam A</span></p>
    <div class="bar__stats mono">
      <button class="run" data-run aria-pressed="true"><i></i><span>Running</span></button>
      <span class="hide-sm">Infer <b data-ms>—</b> ms</span>
      <span class="hide-sm">σ <b data-sigma>—</b></span>
    </div>
  </header>

  <main class="qc">
    <section class="stage" aria-label="Inspection image">
      <div class="stage__head mono">
        <span data-panel>Panel —</span>
        <span class="stage__hint">Drag to scratch · Click to drop a particle · Drop an image to inspect</span>
      </div>
      <div class="stage__view" data-view>
        <canvas class="stage__cv" aria-label="Panel under inspection with detected defects"></canvas>
        <div class="tip mono" role="tooltip" hidden></div>
        <div class="drop mono" hidden>Drop to inspect</div>
      </div>
      <div class="strip" data-strip aria-label="Recent panels"></div>
    </section>

    <aside class="rail" aria-label="Verdict">
      <div class="verdict" data-verdict>
        <span class="mono">Verdict</span>
        <b>—</b>
        <small class="mono" data-why></small>
      </div>

      <div class="block">
        <label class="label mono" for="tau">Confidence τ <output data-tau>0.75</output></label>
        <input id="tau" type="range" min="0.5" max="0.98" step="0.01" value="0.75">
        <canvas class="pr" data-pr aria-label="Precision and recall versus threshold"></canvas>
        <p class="pr__legend mono"><span><i class="p"></i>Precision <b data-p>—</b></span><span><i class="r"></i>Recall <b data-r>—</b></span><span>Yield <b data-y>—</b></span></p>
      </div>

      <div class="block">
        <p class="label mono">Classes</p>
        <div class="chips" data-chips></div>
      </div>

      <div class="block block--grow">
        <p class="label mono">Detections <span data-count></span></p>
        <ol class="dets" data-dets></ol>
      </div>

      <div class="block">
        <p class="label mono">Loupe <span data-loupe-cap>×4</span></p>
        <canvas class="loupe" width="300" height="168"></canvas>
      </div>
    </aside>
  </main>

  <script src="app.js?v=10162115"></script>
</body>
</html>
